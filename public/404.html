<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found — Sumit Anand</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: #030711;
        color: #f4f8ff;
        font-family:
          'Space Grotesk',
          system-ui,
          -apple-system,
          sans-serif;
      }
      main {
        width: min(100%, 520px);
        padding: 2rem;
        border: 1px solid rgba(98, 176, 255, 0.28);
        border-radius: 18px;
        background: #0a1630;
      }
      p.code {
        margin: 0 0 0.5rem;
        color: #4be0ff;
        font:
          600 0.78rem/1.4 'JetBrains Mono',
          monospace;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(1.75rem, 4vw, 2.35rem);
        letter-spacing: -0.04em;
      }
      p.copy {
        margin: 0 0 1.5rem;
        color: #c2cde2;
        line-height: 1.65;
      }
      a {
        display: inline-flex;
        align-items: center;
        padding: 0.75rem 1.25rem;
        border-radius: 12px;
        background: linear-gradient(115deg, #4be0ff, #8fb8ff);
        color: #030711;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code">Signal 404 · Route Not Found</p>
      <h1>This channel is offline.</h1>
      <p class="copy">
        The requested route does not exist on Sumit Anand&apos;s portfolio. Return to the main
        command center to inspect deployments, credentials, and contact channels.
      </p>
      <a href="./">Return to portfolio</a>
    </main>
  </body>
</html>
